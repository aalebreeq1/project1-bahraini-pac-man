<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahraini Pac-Man</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./Js/game.js" defer></script>
</head>

<body>
    <div id="header-title">
        <h1>Bahrani pac-man</h1>
        <h3>Score: <span id="score-board">0</span> XP</h3>
        <h3>Time: <span id="time-board">0</span> Sec</h3>
    </div>
    <div id="audio-container">
        <button id="mute-btn"></button>
    </div>
    <audio id="bg-audio" src="./assets/PacMan-audio.mp3" loop></audio>

    <div id="game-container">
        <div id="maze-container"></div>

    </div>

    <div id="parent-overlay">
        <div id="overlay">
            <div id="overlay-content">
                <h1>Game Over: <span id="message"></span></h1>
                <p>Your score: <span id="final-score">0</span> </p>
                <p>Your Time: <span id="final-time">0</span></p>
                <button id="reset-btn">Restart</button>
            </div>
        </div>
    </div>

</body>

</html>
